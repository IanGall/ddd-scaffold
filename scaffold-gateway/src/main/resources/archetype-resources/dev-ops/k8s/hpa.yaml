# 水平扩缩容。
#
# 网关是无状态进程（不持有 Session、不连数据库，也没有 ID 生成器租约），伸缩代价低，可以比标准服务更激进。
# 缩容留 150s 稳定窗，抑制流量毛刺引起的抖动。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ${rootArtifactId}
  labels:
    app.kubernetes.io/name: ${rootArtifactId}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${rootArtifactId}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    # Utilization 口径 = 实际用量 / requests，因此 Deployment 必须设置 requests.cpu，否则指标为 unknown
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 150
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
