#set( $symbol_dollar = '$' )
server:
  port: 8092

spring:
  application:
    name: ${rootArtifactId}
  profiles:
    active: dev

dubbo:
  application:
    name: ${rootArtifactId}
    qos-enable: false
    metadata-type: remote
    # 元数据服务与业务服务保持同协议：不显式指定时 Dubbo 内部的兜底值是 tri
    metadata-service-protocol: dubbo
  consumer:
    check: false

  metrics:
    export-metrics-service: false

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: info
