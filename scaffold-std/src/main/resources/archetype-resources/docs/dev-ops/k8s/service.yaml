# 服务只在集群内被消费方以 Dubbo 调用（服务发现由 Nacos 承担，consumer 拿到的是 podIP:20880）。
# 这个 Service 只是运维入口，例如 kubectl port-forward svc/${rootArtifactId}-boot 20880:20880。
# 刻意保持普通 ClusterIP：服务发现已有 Nacos，再加一层 headless DNS 只会产生双份真相。
apiVersion: v1
kind: Service
metadata:
  name: ${rootArtifactId}-boot
  labels:
    app.kubernetes.io/name: ${rootArtifactId}-boot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ${rootArtifactId}-boot
  ports:
    - name: dubbo
      port: 20880
      targetPort: dubbo
      protocol: TCP
