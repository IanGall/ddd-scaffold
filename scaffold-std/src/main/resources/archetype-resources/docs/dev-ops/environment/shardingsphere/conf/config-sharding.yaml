databaseName: sharding_db

dataSources:
  ds_0:
    url: jdbc:mysql://${symbol_dollar}{SHARDING_MYSQL_HOST:127.0.0.1}:${symbol_dollar}{SHARDING_MYSQL_PORT:13306}/${symbol_dollar}{SHARDING_MYSQL_DATABASE_0:ian_dev_tech_db_00}?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
    username: ${symbol_dollar}{SHARDING_MYSQL_USERNAME:root}
    password: ${symbol_dollar}{SHARDING_MYSQL_PASSWORD:}
    connectionTimeoutMilliseconds: 30000
    idleTimeoutMilliseconds: 60000
    maxLifetimeMilliseconds: 1800000
    maxPoolSize: 15
    minPoolSize: 5
  ds_1:
    url: jdbc:mysql://${symbol_dollar}{SHARDING_MYSQL_HOST:127.0.0.1}:${symbol_dollar}{SHARDING_MYSQL_PORT:13306}/${symbol_dollar}{SHARDING_MYSQL_DATABASE_1:ian_dev_tech_db_01}?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
    username: ${symbol_dollar}{SHARDING_MYSQL_USERNAME:root}
    password: ${symbol_dollar}{SHARDING_MYSQL_PASSWORD:}
    connectionTimeoutMilliseconds: 30000
    idleTimeoutMilliseconds: 60000
    maxLifetimeMilliseconds: 1800000
    maxPoolSize: 15
    minPoolSize: 5

rules:
  - !SHARDING
    # 表的路由
    tables:
      user_order:
        actualDataNodes: ds_$->{0..1}.user_order_$->{0..3}
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: user_order_inline
    # 路由算法
    shardingAlgorithms:
      # 库-路由算法 2是两个库，库的数量。库的数量用哈希模2来计算。
      database_inline:
        type: INLINE
        props:
          algorithm-expression: ds_$->{Math.abs(user_id.hashCode()) % 2}

      # 表-路由算法 4是一个库里，表的数量。4 - 1 为了获得 011 这样的二进制值。不推荐 user_order_$->{Math.abs(user_id.hashCode()) % 2} 作为表的路由
      user_order_inline:
        type: INLINE
        props:
          algorithm-expression: user_order_$->{(user_id.hashCode() ^ (user_id.hashCode()) >>> 16) & (4 - 1)}

    # 默认库的路由
    defaultDatabaseStrategy:
      standard:
        shardingColumn: user_id
        shardingAlgorithmName: database_inline
    # 默认id生成策略
    defaultKeyGenerateStrategy:
      column: id
      keyGeneratorName: snowflake

    keyGenerators:
      snowflake:
        type: SNOWFLAKE

