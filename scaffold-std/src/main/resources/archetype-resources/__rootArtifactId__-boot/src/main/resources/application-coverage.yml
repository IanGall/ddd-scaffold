# 分布式 E2E 覆盖率配置 —— 由 coverage-controller 读取，服务自身不依赖。
#
# 约定：
#   • classes-directories 只列需要纳入覆盖率统计的模块
#   • source-directories 用于在 HTML 报告里展示源码行覆盖明细
#   • 相对路径基于 boot 模块的启动目录解析
#   • 新拆分的模块记得同步补进这两个列表，否则该模块的类不会出现在报告中
#   • 同一服务多实例同时采集时，需要给每个实例换成不同的 name
coverage:
  reports:
    - name: ${rootArtifactId}
      classes-directories:
        - ../../../${rootArtifactId}-trigger/target/classes
        - ../../../${rootArtifactId}-domain/target/classes
        - ../../../${rootArtifactId}-infrastructure/target/classes
        - ../../../${rootArtifactId}-api/target/classes
      source-directories:
        - ../../../${rootArtifactId}-trigger/src/main/java
        - ../../../${rootArtifactId}-domain/src/main/java
        - ../../../${rootArtifactId}-infrastructure/src/main/java
        - ../../../${rootArtifactId}-api/src/main/java
