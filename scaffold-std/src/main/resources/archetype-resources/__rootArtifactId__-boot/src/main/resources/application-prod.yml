server:
  port: 8091

# 生产数据库连接必须由部署环境注入，禁止在模板中写入地址或凭据。
# 需要时在此补充 spring.datasource.* / spring.data.redis.* / dubbo.registry.* 的 ${ENV} 引用（不保留可用默认值）。

dubbo:
  protocol:
    name: dubbo
    port: ${symbol_dollar}{DUBBO_PROTOCOL_PORT:20880}
    ssl-enabled: false

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml
