server:
  port: 8091

channel:
  security:
    encryption:
      key-id: ${symbol_dollar}{CHANNEL_ENCRYPTION_KEY_ID}
      master-key: ${symbol_dollar}{CHANNEL_ENCRYPTION_MASTER_KEY}

# 生产数据库连接必须由部署环境注入，禁止在模板中写入地址或凭据。

dubbo:
  protocol:
    ssl-enabled: false

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml
