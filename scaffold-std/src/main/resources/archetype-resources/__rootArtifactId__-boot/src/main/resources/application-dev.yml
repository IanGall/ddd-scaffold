server:
  port: 8091

# 数据库连接：地址与账号由环境变量注入（本地见仓库根 .env.local，模板见 .env.example）
spring:
  data:
    redis:
      host: ${symbol_dollar}{REDIS_HOST:127.0.0.1}
      port: ${symbol_dollar}{REDIS_PORT:6379}
      password: ${symbol_dollar}{REDIS_PASSWORD}
      database: ${symbol_dollar}{REDIS_DATABASE:0}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${symbol_dollar}{MYSQL_HOST:127.0.0.1}:${symbol_dollar}{MYSQL_PORT:3306}/${symbol_dollar}{MYSQL_DATABASE:${rootArtifactId}}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false
    username: ${symbol_dollar}{MYSQL_USERNAME:root}
    password: ${symbol_dollar}{MYSQL_PASSWORD:}

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  # 显式走 Spring Boot 配置绑定；此前 config-location 指向空 XML 会吞掉 mybatis.* 配置
  configuration:
    map-underscore-to-camel-case: true

# Dubbo
dubbo:
  application:
    name: ${rootArtifactId}
    version: 1.0.0
  registry:
    id: nacos-registry
    address: nacos://${symbol_dollar}{NACOS_HOST:127.0.0.1}:8848
    username: ${symbol_dollar}{NACOS_USERNAME}
    password: ${symbol_dollar}{NACOS_PASSWORD}
    parameters:
      enable-empty-protection: true
  protocol:
    name: tri
    port: ${symbol_dollar}{TRIPLE_PROTOCOL_PORT:50051}
    ssl-enabled: false
  scan:
    base-packages: ${package}.trigger.rpc

# 日志
logging:
  level:
    root: info
    com.alibaba.nacos.client.logging.NacosLogging: error
  config: classpath:logback-spring.xml
